<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeyraFX Studio AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eaf2ff;font:14px system-ui}header{padding:12px;background:#080c17;border-bottom:1px solid #263451;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:20px;font-weight:800}.brand span{color:#72f0b5}button{background:#1a2742;color:#fff;border:1px solid #344767;border-radius:8px;padding:8px 10px;cursor:pointer}button.primary{background:#72f0b5;color:#06130d}main{display:grid;grid-template-columns:230px 1fr 230px;height:calc(100vh - 60px)}aside{background:#111a2e;padding:12px;overflow:auto;border-right:1px solid #263451}aside:last-child{border-left:1px solid #263451;border-right:0}h3{font-size:12px;color:#72f0b5;text-transform:uppercase}label{display:block;color:#9aa9c4;margin:10px 0 4px}input{width:100%}#view{min-width:0;position:relative}canvas{display:block;width:100%;height:100%}#status{position:absolute;bottom:10px;left:10px;background:#050914cc;padding:6px;border-radius:5px}@media(max-width:750px){main{grid-template-columns:1fr;height:auto}#view{height:55vh;grid-row:1}aside{border:0;border-bottom:1px solid #263451}body{overflow:auto}}
</style></head><body>
<header><div class="brand">VeyraFX <span>Studio AI</span></div><div><button id="cube">Add Cube</button> <button id="sphere">Add Sphere</button> <button id="import">Import GLB/GLTF</button> <button id="shot" class="primary">Screenshot</button> <button id="rec">Record WebM</button></div></header>
<main><aside><h3>Scene & Background</h3><label>Image background</label><input type="file" id="img" accept="image/*"><label>Video background</label><input type="file" id="vid" accept="video/*"><button id="clear">Clear background</button><hr><h3>Transform selected object</h3><label>Position X</label><input id="x" type="range" min="-10" max="10" step=".1" value="0"><label>Position Y</label><input id="y" type="range" min="-10" max="10" step=".1" value="0"><label>Position Z</label><input id="z" type="range" min="-10" max="10" step=".1" value="0"><label>Rotation Y</label><input id="rot" type="range" min="-3.14" max="3.14" step=".01" value="0"><label>Scale</label><input id="scale" type="range" min=".1" max="4" step=".1" value="1"></aside>
<section id="view"><div id="status">Ready — click an object to select</div></section><aside><h3>Lighting</h3><label>Ambient light</label><input id="amb" type="range" min="0" max="3" step=".1" value="1"><label>Directional light</label><input id="dir" type="range" min="0" max="4" step=".1" value="2"><hr><h3>Selected object</h3><div id="info">None</div><button id="del">Delete selected</button><button id="reset">Reset scene</button><p style="color:#9aa9c4">GLB/GLTF import, PNG screenshot, and WebM recording. Internet connection required for Three.js.</p></aside></main>
<input id="model" type="file" accept=".glb,.gltf" hidden>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const el=document.getElementById('view'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101827);
const camera=new THREE.PerspectiveCamera(55,el.clientWidth/el.clientHeight,.1,1000);camera.position.set(5,4,7);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(el.clientWidth,el.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.GridHelper(30,30));scene.add(new THREE.AxesHelper(2));
const amb=new THREE.AmbientLight(0xffffff,1),dir=new THREE.DirectionalLight(0xffffff,2);dir.position.set(5,8,5);scene.add(amb,dir);
let selected=null,items=[],recorder=null,chunks=[],video=null;
function select(o){selected=o;document.getElementById('info').textContent=o?o.name:'None';if(o){['x','y','z'].forEach((id,i)=>document.getElementById(id).value=o.position[['x','y','z'][i]]);document.getElementById('rot').value=o.rotation.y;document.getElementById('scale').value=o.scale.x}}
function add(geometry,color,name){let o=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color,metalness:.2,roughness:.35}));o.name=name;scene.add(o);items.push(o);select(o);status.textContent=name+' added'}
function cube(){add(new THREE.BoxGeometry(1,1,1),0x72f0b5,'Cube')}function sphere(){add(new THREE.SphereGeometry(.7,32,24),0x6da8ff,'Sphere')}
cube();
renderer.domElement.addEventListener('pointerdown',e=>{let r=renderer.domElement.getBoundingClientRect(),p=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(p,camera);let hits=ray.intersectObjects(items,true);if(hits.length){let o=hits[0].object;while(o.parent!==scene&&o.parent)o=o.parent;select(o)}});
['x','y','z','rot','scale'].forEach(id=>document.getElementById(id).oninput=e=>{if(!selected)return;let v=+e.target.value;if(id==='x')selected.position.x=v;if(id==='y')selected.position.y=v;if(id==='z')selected.position.z=v;if(id==='rot')selected.rotation.y=v;if(id==='scale')selected.scale.setScalar(v)});
document.getElementById('cube').onclick=cube;document.getElementById('sphere').onclick=sphere;document.getElementById('amb').oninput=e=>amb.intensity=+e.target.value;document.getElementById('dir').oninput=e=>dir.intensity=+e.target.value;
document.getElementById('import').onclick=()=>document.getElementById('model').click();document.getElementById('model').onchange=e=>{let f=e.target.files[0];if(!f)return;new GLTFLoader().load(URL.createObjectURL(f),g=>{g.scene.name=f.name;scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh)items.push(o)});select(g.scene);status.textContent='Imported '+f.name},undefined,()=>status.textContent='Could not import model')};
document.getElementById('del').onclick=()=>{if(selected){scene.remove(selected);items=items.filter(o=>o!==selected);select(null);status.textContent='Deleted'}};
document.getElementById('reset').onclick=()=>{items.forEach(o=>scene.remove(o));items=[];select(null);cube();camera.position.set(5,4,7)};
function shot(){let a=document.createElement('a');a.download='veyrafx_screenshot.png';a.href=renderer.domElement.toDataURL('image/png');a.click()}document.getElementById('shot').onclick=shot;
document.getElementById('img').onchange=e=>{let f=e.target.files[0];if(f)new THREE.TextureLoader().load(URL.createObjectURL(f),t=>{t.colorSpace=THREE.SRGBColorSpace;scene.background=t})};
document.getElementById('vid').onchange=e=>{let f=e.target.files[0];if(!f)return;video=document.createElement('video');video.src=URL.createObjectURL(f);video.loop=true;video.muted=true;video.play();let t=new THREE.VideoTexture(video);scene.background=t};document.getElementById('clear').onclick=()=>{scene.background=new THREE.Color(0x101827);if(video)video.pause()};
document.getElementById('rec').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();document.getElementById('rec').textContent='Record WebM';return}try{chunks=[];recorder=new MediaRecorder(renderer.domElement.captureStream(30));recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=u;a.download='veyrafx_recording.webm';a.click()};recorder.start();document.getElementById('rec').textContent='Stop recording';status.textContent='Recording…'}catch(e){status.textContent='Recording unsupported in this browser'}};
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();window.onresize=()=>{camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)};
</script></body></html>
